<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#001b35">
    <title>Uniform Shop</title>
    <style>
        @font-face {
            font-family: 'Apercu Regular Pro';
            src: url('apercu_regular_pro.otf') format('opentype'),
                 url('https://spirttomb.github.io/Lineup-Generator/apercu_regular_pro.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --navy-950: #001b35;
            --navy-900: #002a4f;
            --navy-800: #003d73;
            --navy-700: #044e8f;
            --gold: #f59e0b;
            --gold-hi: #fbbf24;
            --gold-soft: #fef3c7;
            --ink: #1e293b;
            --muted: #5C768D;
            --line: #e1e8f0;
            --line-strong: #c7d3e0;
            --tint: #f5f8fb;
            --canvas: #edf1f6;
            --photo: #e1e1e1;
            --shadow-sm: 0 1px 2px rgba(0, 27, 53, 0.06), 0 2px 6px rgba(0, 27, 53, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Apercu Regular Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--canvas); color: var(--ink); min-height: 100vh;
            -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }
        input, select, textarea, button { font-family: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        svg { flex-shrink: 0; }
        a { color: inherit; }
        [hidden] { display: none !important; }

        /* ---------- App bar ---------- */
        .appbar { background: var(--navy-950); color: #fff; position: sticky; top: 0; z-index: 60; }
        .appbar-inner { max-width: 1180px; margin: 0 auto; padding: 0.6rem 1.5rem; display: flex; align-items: center; gap: 0.9rem; }
        .brand { display: flex; align-items: center; gap: 0.7rem; }
        .brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--gold); color: var(--navy-950); display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
        .brand-name { font-weight: 800; font-size: 1.08rem; letter-spacing: -0.01em; line-height: 1; }
        .brand-name small { display: block; font-weight: 600; font-size: 0.66rem; color: #8ea6bf; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 0.25rem; }
        .tabs { display: flex; gap: 0.25rem; margin-left: 0.8rem; background: rgba(255, 255, 255, 0.07); padding: 3px; border-radius: 12px; }
        .tabs button { border: none; background: transparent; color: #c6d5e4; font-weight: 700; font-size: 0.9rem; padding: 0.45rem 0.85rem; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; }
        .tabs button.on { background: #fff; color: var(--navy-900); }
        .tabs .count { background: var(--gold); color: var(--navy-950); border-radius: 999px; font-size: 0.72rem; padding: 0.05rem 0.45rem; font-weight: 800; }
        .bar-actions { margin-left: auto; display: flex; align-items: center; gap: 0.35rem; }
        .who { display: flex; align-items: center; gap: 0.5rem; color: #c6d5e4; font-size: 0.88rem; font-weight: 700; margin-right: 0.2rem; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy-800); color: var(--gold-hi); display: grid; place-items: center; font-size: 0.72rem; font-weight: 800; }
        .icon-btn { width: 40px; height: 40px; border-radius: 11px; border: none; background: transparent; color: #c6d5e4; display: grid; place-items: center; cursor: pointer; }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .cart-btn {
            position: relative; display: inline-flex; align-items: center; gap: 0.45rem; border: none; border-radius: 11px; cursor: pointer;
            background: var(--gold); color: var(--navy-950); font-weight: 800; font-size: 0.92rem; padding: 0.55rem 0.9rem;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
        }
        .cart-btn:hover { background: var(--gold-hi); }
        .cart-badge { background: var(--navy-950); color: #fff; border-radius: 999px; font-size: 0.72rem; min-width: 1.35rem; height: 1.35rem; padding: 0 0.35rem; display: grid; place-items: center; }
        .cart-btn.bump { animation: bump 0.4s ease; }
        @keyframes bump { 40% { transform: scale(1.12); } }

        /* ---------- Hero ---------- */
        .hero {
            background: radial-gradient(1100px 300px at 85% -40%, rgba(245, 158, 11, 0.18), transparent 60%), linear-gradient(180deg, var(--navy-800), var(--navy-900));
            color: #fff; padding: 1.7rem 1.5rem 4.4rem;
        }
        .hero-inner { max-width: 1180px; margin: 0 auto; }
        .eyebrow { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-hi); }
        .hero h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin-top: 0.3rem; line-height: 1.1; }
        .hero p { color: #aebfd1; font-size: 0.93rem; margin-top: 0.4rem; }
        .workspace { max-width: 1180px; margin: -3rem auto 0; padding: 0 1.5rem 3rem; position: relative; }

        /* ---------- Shop ---------- */
        .chips { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .chip { border: none; background: #fff; color: var(--navy-900); font-weight: 700; font-size: 0.9rem; padding: 0.55rem 1rem; border-radius: 999px; cursor: pointer; box-shadow: var(--shadow-sm); }
        .chip.on { background: var(--gold); color: var(--navy-950); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 1rem; }
        .product { background: #fff; border-radius: 18px; box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; border: none; text-align: left; color: inherit; font: inherit; }
        .product:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -16px rgba(0, 27, 53, 0.45); }
        .product:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
        .photo { position: relative; aspect-ratio: 1; background: var(--photo); display: grid; place-items: center; overflow: hidden; }
        .photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .photo .none { color: #9aa5b1; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 700; }
        .photo .flag { position: absolute; left: 0.6rem; top: 0.6rem; background: var(--navy-900); color: var(--gold-hi); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.25rem 0.5rem; border-radius: 7px; }
        .p-info { padding: 0.85rem 0.95rem 0.95rem; display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }
        .p-name { font-weight: 800; color: var(--navy-900); font-size: 1rem; line-height: 1.25; }
        .p-meta { color: var(--muted); font-size: 0.82rem; }
        .p-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 0.55rem; }
        .price { font-weight: 800; color: var(--navy-900); font-size: 1.05rem; }
        .p-add { background: var(--navy-900); color: #fff; border-radius: 10px; padding: 0.42rem 0.75rem; font-weight: 800; font-size: 0.82rem; display: inline-flex; gap: 0.35rem; align-items: center; }
        .product.locked { cursor: default; }
        .product.locked:hover { transform: none; box-shadow: var(--shadow-sm); }
        .product.locked .photo img { opacity: 0.45; filter: grayscale(0.6); }
        .product.locked .p-add { background: var(--canvas); color: var(--muted); }
        .in-cart { position: absolute; right: 0.6rem; top: 0.6rem; background: var(--gold); color: var(--navy-950); font-size: 0.72rem; font-weight: 800; padding: 0.25rem 0.5rem; border-radius: 7px; }

        /* ---------- Modals / sheets ---------- */
        .overlay { position: fixed; inset: 0; background: rgba(0, 27, 53, 0.55); backdrop-filter: blur(3px); z-index: 900; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .sheet { background: #fff; border-radius: 22px; width: 94%; max-width: 860px; max-height: 92vh; overflow: auto; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.55); transform: translateY(12px); transition: transform 0.25s; }
        .overlay.active .sheet { transform: none; }
        .close-x { width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255, 255, 255, 0.9); cursor: pointer; color: var(--navy-900); display: grid; place-items: center; box-shadow: var(--shadow-sm); }
        .close-x:hover { background: #fff; }

        .pd { display: grid; grid-template-columns: 1fr 1fr; }
        .pd .photo { aspect-ratio: auto; min-height: 100%; border-radius: 22px 0 0 22px; }
        .pd .photo img { width: auto; height: auto; max-width: 100%; max-height: 560px; }
        .pd .photo img.small { width: min(100%, 360px); }
        .pd-body { padding: 1.5rem 1.5rem 1.3rem; display: flex; flex-direction: column; gap: 1rem; position: relative; }
        .pd-body .close-x { position: absolute; right: 1rem; top: 1rem; background: var(--canvas); }
        .pd-title { font-size: 1.5rem; font-weight: 800; color: var(--navy-900); letter-spacing: -0.01em; padding-right: 2.6rem; line-height: 1.15; }
        .pd-price { font-size: 1.2rem; font-weight: 800; color: var(--navy-700); margin-top: 0.2rem; }
        .pd-note { font-size: 0.85rem; color: var(--muted); }
        .opt-label { font-size: 0.76rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.45rem; display: flex; justify-content: space-between; gap: 0.5rem; }
        .opt-label b { color: var(--navy-900); text-transform: none; letter-spacing: 0; }
        .seg { display: inline-flex; background: var(--canvas); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
        .seg button { border: none; background: transparent; padding: 0.5rem 0.95rem; border-radius: 9px; font-weight: 700; font-size: 0.92rem; color: var(--muted); cursor: pointer; }
        .seg button.on { background: #fff; color: var(--navy-900); box-shadow: var(--shadow-sm); }
        .sizes { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .sizes button { min-width: 3rem; padding: 0.55rem 0.6rem; border-radius: 10px; border: 1.5px solid var(--line-strong); background: #fff; color: var(--navy-900); font-weight: 800; font-size: 0.92rem; cursor: pointer; }
        .sizes button:hover { border-color: var(--navy-800); }
        .sizes button.on { background: var(--navy-900); border-color: var(--navy-900); color: var(--gold-hi); }
        .opt.missing .opt-label { color: #b91c1c; }
        .opt.missing .sizes button, .opt.missing .seg { box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25); }
        .stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line-strong); border-radius: 12px; overflow: hidden; }
        .stepper button { width: 40px; height: 40px; border: none; background: #fff; font-size: 1.2rem; font-weight: 800; color: var(--navy-900); cursor: pointer; }
        .stepper button:hover { background: var(--tint); }
        .stepper span { min-width: 2.4rem; text-align: center; font-weight: 800; color: var(--navy-900); }
        .stepper.sm button { width: 32px; height: 32px; font-size: 1rem; }
        .stepper.sm span { min-width: 1.8rem; font-size: 0.92rem; }
        .pd-actions { display: flex; gap: 0.6rem; align-items: center; margin-top: auto; padding-top: 0.4rem; flex-wrap: wrap; }
        .pd-link { font-size: 0.86rem; font-weight: 700; color: var(--navy-700); display: inline-flex; align-items: center; gap: 0.3rem; text-decoration: none; }
        .pd-link:hover { text-decoration: underline; }

        .btn-primary {
            background: var(--gold); color: var(--navy-950); border: none; border-radius: 12px; padding: 0.8rem 1.25rem;
            font-weight: 800; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            box-shadow: 0 8px 18px -8px rgba(245, 158, 11, 0.8);
        }
        .btn-primary:hover { background: var(--gold-hi); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        .btn-primary.grow { flex: 1; }
        .btn-secondary { background: #fff; border: 1.5px solid var(--line-strong); color: var(--navy-900); border-radius: 12px; padding: 0.7rem 1rem; font-weight: 700; font-size: 0.93rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
        .btn-secondary:hover { border-color: var(--navy-800); }
        .btn-secondary:disabled { opacity: 0.45; cursor: default; }
        .btn-dark { background: var(--navy-900); border: none; color: #fff; border-radius: 12px; padding: 0.7rem 1rem; font-weight: 800; font-size: 0.93rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; }
        .btn-dark:hover { background: var(--navy-700); }
        .btn-dark:disabled { opacity: 0.45; cursor: default; }
        .link-btn { background: none; border: none; color: var(--navy-700); font-weight: 700; font-size: 0.87rem; cursor: pointer; padding: 0.3rem 0.1rem; }
        .link-btn:hover { text-decoration: underline; }
        .link-btn.danger { color: #dc2626; }

        /* ---------- Cart drawer ---------- */
        #cartOverlay { justify-content: flex-end; align-items: stretch; }
        .drawer { background: #fff; width: min(440px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: -20px 0 50px -20px rgba(0, 0, 0, 0.5); transform: translateX(30px); transition: transform 0.25s; }
        #cartOverlay.active .drawer { transform: none; }
        .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--line); }
        .drawer-head h3 { font-size: 1.2rem; font-weight: 800; color: var(--navy-900); }
        .drawer-head .close-x { background: var(--canvas); box-shadow: none; }
        .drawer-body { flex: 1; overflow: auto; padding: 0.4rem 1.25rem 1rem; }
        .drawer-foot { border-top: 1px solid var(--line); padding: 1rem 1.25rem 1.2rem; display: flex; flex-direction: column; gap: 0.7rem; }
        .line { display: flex; gap: 0.8rem; padding: 0.85rem 0; border-bottom: 1px solid var(--line); }
        .line .thumb { width: 66px; height: 66px; border-radius: 12px; background: var(--photo); overflow: hidden; flex-shrink: 0; display: grid; place-items: center; color: #9aa5b1; }
        .line .thumb img { width: 100%; height: 100%; object-fit: contain; }
        .line-main { flex: 1; min-width: 0; }
        .line-name { font-weight: 800; color: var(--navy-900); }
        .line-det { color: var(--muted); font-size: 0.84rem; margin-top: 0.1rem; }
        .line-row { display: flex; align-items: center; justify-content: space-between; margin-top: 0.45rem; gap: 0.5rem; }
        .line-price { font-weight: 800; color: var(--navy-900); font-size: 0.95rem; }
        .cart-empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem 1.5rem; }
        .cart-empty .big { width: 64px; height: 64px; border-radius: 18px; background: var(--canvas); color: var(--navy-700); display: grid; place-items: center; margin: 0 auto 0.8rem; }
        .field { width: 100%; background: var(--tint); border: 1.5px solid var(--line); border-radius: 12px; padding: 0.7rem 0.85rem; font-size: 0.97rem; color: var(--ink); resize: vertical; }
        .field:focus { outline: none; border-color: var(--gold); background: #fff; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18); }
        .total-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; color: var(--navy-900); }
        .total-row small { display: block; font-weight: 600; color: var(--muted); font-size: 0.78rem; }
        .total-row .amt { font-size: 1.25rem; }
        .ordering-as { font-size: 0.84rem; color: var(--muted); }
        .ordering-as b { color: var(--navy-900); }

        /* ---------- Done ---------- */
        .done { max-width: 460px; padding: 2rem 1.6rem 1.6rem; text-align: center; }
        .done-icon { width: 70px; height: 70px; border-radius: 50%; background: #dcfce7; color: #15803d; display: grid; place-items: center; margin: 0 auto 1rem; }
        .done h3 { font-size: 1.4rem; color: var(--navy-900); }
        .done p { color: var(--muted); margin: 0.4rem 0 1.1rem; font-size: 0.93rem; }
        .done ul { list-style: none; text-align: left; background: var(--tint); border-radius: 14px; padding: 0.4rem 0.9rem; margin-bottom: 1.2rem; }
        .done li { padding: 0.45rem 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
        .done li:last-child { border-bottom: none; }
        .done li b { color: var(--navy-900); }

        /* ---------- Sign in ---------- */
        #signin { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem;
            background: radial-gradient(900px 380px at 85% -10%, rgba(245, 158, 11, 0.18), transparent 60%), linear-gradient(180deg, var(--navy-800), var(--navy-950)); overflow: auto; }
        .signin-card { background: #fff; border-radius: 24px; width: 100%; max-width: 400px; padding: 1.7rem 1.5rem 1.5rem; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.6); text-align: center; }
        .signin-card h2 { font-size: 1.4rem; color: var(--navy-900); }
        .signin-card p { color: var(--muted); font-size: 0.9rem; margin: 0.3rem 0 1.1rem; }
        .pin-field { width: 100%; text-align: center; letter-spacing: 0.5em; font-size: 1.4rem; font-weight: 800; background: var(--tint); border: 1.5px solid var(--line); border-radius: 12px; padding: 0.7rem; color: var(--ink); }
        .pin-field:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18); }
        .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.55rem; margin-top: 1rem; }
        .pin-keypad button { padding: 0.85rem; font-size: 1.35rem; font-weight: 800; background: var(--navy-900); color: #fff; border: none; border-radius: 12px; cursor: pointer; }
        .pin-keypad button:hover { background: var(--navy-700); }
        .pin-keypad button.muted { background: var(--canvas); color: var(--navy-900); font-size: 0.95rem; }
        .signin-msg { margin-top: 0.9rem; font-size: 0.9rem; font-weight: 700; color: var(--muted); min-height: 1.2rem; }
        .signin-msg.err { color: #b91c1c; }

        /* ---------- Orders (Sharron) ---------- */
        .card { background: #fff; border-radius: 18px; box-shadow: var(--shadow-sm); margin-bottom: 1rem; }
        .o-toolbar { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding: 1rem 1.2rem; }
        .o-toolbar .push { margin-left: auto; }
        .o-stats { display: flex; gap: 0.45rem; flex-wrap: wrap; }
        .pill { border-radius: 999px; padding: 0.35rem 0.75rem; font-weight: 800; font-size: 0.82rem; background: var(--canvas); color: var(--navy-900); }
        .pill.gold { background: var(--gold-soft); color: #92400e; }
        .o-group { overflow: hidden; }
        .o-head { display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem 1.2rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
        .o-head .avatar { width: 38px; height: 38px; background: var(--navy-900); font-size: 0.8rem; }
        .o-head .thumb { width: 48px; height: 48px; border-radius: 12px; background: var(--photo); overflow: hidden; display: grid; place-items: center; color: #9aa5b1; }
        .o-head .thumb img { width: 100%; height: 100%; object-fit: contain; }
        .o-title { font-weight: 800; color: var(--navy-900); font-size: 1.05rem; }
        .o-sub { color: var(--muted); font-size: 0.82rem; }
        .o-head .push { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .o-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1.2rem; border-bottom: 1px solid var(--line); cursor: pointer; }
        .o-item:last-child { border-bottom: none; }
        .o-item:hover { background: var(--tint); }
        .o-item.sel { background: #fffbeb; }
        .o-item input[type=checkbox] { width: 1.2rem; height: 1.2rem; accent-color: #0f2a4a; flex-shrink: 0; cursor: pointer; }
        .o-main { flex: 1; min-width: 0; }
        .o-name { font-weight: 800; color: var(--navy-900); }
        .o-det { color: var(--ink); font-size: 0.9rem; margin-top: 0.1rem; }
        .o-det .qty { display: inline-block; background: var(--navy-900); color: var(--gold-hi); font-weight: 800; border-radius: 6px; font-size: 0.78rem; padding: 0.05rem 0.4rem; margin-right: 0.35rem; }
        .o-when { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
        .shop-link { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.84rem; font-weight: 800; color: var(--navy-700); text-decoration: none; padding: 0.4rem 0.6rem; border-radius: 9px; background: var(--tint); white-space: nowrap; }
        .shop-link:hover { background: var(--canvas); }
        .o-empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); }
        .o-request { white-space: pre-wrap; }
        .hist-row { display: flex; gap: 0.8rem; padding: 0.75rem 1.2rem; border-bottom: 1px solid var(--line); align-items: flex-start; flex-wrap: wrap; }
        .hist-row:last-child { border-bottom: none; }
        .hist-row ul { list-style: none; flex: 1; min-width: 14rem; }
        .hist-row li { font-size: 0.88rem; padding: 0.1rem 0; }
        .hist-row li b { color: var(--navy-900); }
        .selbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 400; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -10px 24px -14px rgba(0, 27, 53, 0.45); transform: translateY(110%); visibility: hidden; transition: transform 0.25s, visibility 0.25s; }
        .selbar.on { transform: none; visibility: visible; }
        .selbar-inner { max-width: 1180px; margin: 0 auto; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .selbar-msg { flex: 1; font-weight: 800; color: var(--navy-900); min-width: 10rem; }
        .loading { padding: 3rem 1rem; text-align: center; color: var(--muted); }
        .spinner { border: 4px solid var(--line); width: 42px; height: 42px; border-radius: 50%; border-left-color: var(--gold); animation: spin 0.9s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        body.has-selbar { padding-bottom: 5rem; }

        /* ---------- Toast ---------- */
        #toast { position: fixed; left: 50%; top: 4.6rem; transform: translate(-50%, -20px); z-index: 3000; background: var(--navy-950); color: #fff; padding: 0.75rem 1.15rem; border-radius: 14px; font-weight: 700; font-size: 0.92rem; box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.5); max-width: min(92vw, 560px); text-align: center; opacity: 0; visibility: hidden; pointer-events: none; transition: transform 0.3s, opacity 0.2s, visibility 0.3s; }
        #toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
        #toast.success { background: #065f46; }
        #toast.error { background: #b91c1c; }

        @media (max-width: 760px) {
            .appbar-inner { padding: 0.55rem 0.9rem; gap: 0.5rem; flex-wrap: wrap; }
            .brand-name small, .who span { display: none; }
            .tabs { order: 5; width: 100%; margin: 0.1rem 0 0.15rem; }
            .tabs button { flex: 1; justify-content: center; }
            .cart-btn .lbl { display: none; }
            .hero { padding: 1.3rem 1rem 4rem; }
            .hero h1 { font-size: 1.55rem; }
            .workspace { padding: 0 0.75rem 2rem; }
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.65rem; }
            .p-info { padding: 0.7rem 0.75rem 0.8rem; }
            .p-name { font-size: 0.93rem; }
            .p-add .lbl { display: none; }
            .p-add { padding: 0.4rem 0.55rem; }
            .overlay:not(#cartOverlay) { align-items: flex-end; }
            .sheet { width: 100%; max-width: none; border-radius: 22px 22px 0 0; max-height: 94vh; }
            .pd { grid-template-columns: 1fr; }
            .pd .photo { border-radius: 22px 22px 0 0; aspect-ratio: 4 / 3; min-height: 0; }
            .pd-body { padding: 1.1rem 1rem 1.2rem; }
            .pd-body .close-x { top: -3.3rem; right: 0.8rem; background: #fff; }
            .o-toolbar, .o-head, .o-item, .hist-row { padding-left: 0.9rem; padding-right: 0.9rem; }
            .o-item { flex-wrap: wrap; row-gap: 0.4rem; }
            .o-main { flex: 1 1 calc(100% - 2.2rem); }
            .o-item .o-when { margin-left: 1.95rem; }
            .o-item .shop-link { margin-left: auto; }
            .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -0.75rem 1rem; padding: 0 0.75rem 0.3rem; scrollbar-width: none; }
            .chips::-webkit-scrollbar { display: none; }
            .chip { flex-shrink: 0; }
            .selbar-inner { padding: 0.65rem 0.9rem; }
            .done { max-width: none; }
        }
    </style>
</head>

<div id="toast"></div>

<!-- ============ Sign in ============ -->
<div id="signin">
    <div class="signin-card">
        <h2>Uniform Shop</h2>
        <p>Enter your PIN to start an order.</p>
        <input type="password" class="pin-field" id="pinInput" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••" aria-label="PIN"
            oninput="this.value=this.value.replace(/\D/g,''); if (this.value.length === 4) handleLogin()">
        <div class="pin-keypad">
            <button type="button" onclick="pinKey('1')">1</button><button type="button" onclick="pinKey('2')">2</button><button type="button" onclick="pinKey('3')">3</button>
            <button type="button" onclick="pinKey('4')">4</button><button type="button" onclick="pinKey('5')">5</button><button type="button" onclick="pinKey('6')">6</button>
            <button type="button" onclick="pinKey('7')">7</button><button type="button" onclick="pinKey('8')">8</button><button type="button" onclick="pinKey('9')">9</button>
            <button type="button" class="muted" onclick="$('pinInput').value=''">Clear</button><button type="button" onclick="pinKey('0')">0</button><button type="button" class="muted" onclick="$('pinInput').value=$('pinInput').value.slice(0,-1)" aria-label="Delete">&#9003;</button>
        </div>
        <div class="signin-msg" id="signinMsg"></div>
    </div>
</div>

<!-- ============ App ============ -->
<header class="appbar">
    <div class="appbar-inner">
        <div class="brand">
            <span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/></svg></span>
            <div class="brand-name">Uniform<small>Shop</small></div>
        </div>
        <nav class="tabs" id="tabs" hidden>
            <button type="button" class="on" data-view="shop" onclick="showView('shop')">Shop</button>
            <button type="button" data-view="orders" onclick="showView('orders')">Orders <span class="count" id="orderCount" hidden></span></button>
        </nav>
        <div class="bar-actions">
            <div class="who" id="who"></div>
            <button type="button" class="icon-btn" onclick="signOut()" title="Sign out" aria-label="Sign out"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg></button>
            <button type="button" class="cart-btn" id="cartBtn" onclick="openCart()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="lbl">Cart</span><span class="cart-badge" id="cartCount">0</span></button>
        </div>
    </div>
</header>

<div id="shopView">
    <section class="hero">
        <div class="hero-inner">
            <div class="eyebrow">Uniform Shop</div>
            <h1 id="hello">Order your uniform</h1>
            <p>Pick your items and sizes, then place the order. Your leader orders them for you.</p>
        </div>
    </section>
    <main class="workspace">
        <div class="chips" id="chips"></div>
        <div class="grid" id="grid"></div>
    </main>
</div>

<div id="ordersView" hidden>
    <section class="hero">
        <div class="hero-inner">
            <div class="eyebrow">Orders</div>
            <h1>What people ordered</h1>
            <p>Order items on Team Style, then mark them ordered to clear them from this list.</p>
        </div>
    </section>
    <main class="workspace" id="ordersPanel"></main>
</div>

<div class="selbar" id="selbar">
    <div class="selbar-inner">
        <span class="selbar-msg" id="selMsg"></span>
        <button type="button" class="btn-secondary" onclick="clearSelection()">Clear</button>
        <button type="button" class="btn-primary" id="markBtn" onclick="markSelectedOrdered()">Mark as ordered</button>
    </div>
</div>

<!-- Product -->
<div class="overlay" id="productOverlay" onclick="if (event.target === this) closeProduct()">
    <div class="sheet" id="productSheet"></div>
</div>

<!-- Cart -->
<div class="overlay" id="cartOverlay" onclick="if (event.target === this) closeCart()">

        <div class="drawer-head">
            <h3>Your cart</h3>
            <button type="button" class="close-x" onclick="closeCart()" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="drawer-body" id="cartBody"></div>
        <div class="drawer-foot" id="cartFoot"></div>
    </aside>
</div>

<div class="overlay" id="doneOverlay">

</div>

const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function money(n) { return "$" + (Math.round(n * 100) / 100).toFixed(n % 1 ? 2 : 0); }
function priceText(p) { return p.length > 1 ? `${money(p[0])}–${money(p[1])}` : money(p[0]); }
function initials(name) { const w = String(name || "").trim().split(/\s+/); return ((w[0] || "?")[0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase(); }
function productByKey(k) { return PRODUCTS.find(p => p.key === k); }
function toast(msg, type = "info", ms = 3000) {
    const t = $("toast");
    t.innerText = msg; t.className = type; void t.offsetWidth; t.classList.add("show");
    clearTimeout(window.toastT); window.toastT = setTimeout(() => t.classList.remove("show"), ms);
}

// =====================================================================
// GOOGLE SHEETS (read) AND GOOGLE FORM (write), same as the Checklist Tracker
// =====================================================================
async function gviz(sheetId, query, timeoutMs = 10000) {
    const ctrl = new AbortController();
    const tm = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=1&tq=${encodeURIComponent(query)}&_cb=${Date.now()}`;
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) return null;
        const text = await res.text();
        const start = text.indexOf("setResponse(");
        if (start === -1) return null;
        const data = JSON.parse(text.substring(start + "setResponse(".length, text.lastIndexOf(")")));
        if (!data.table) return null;
        return { cols: data.table.cols || [], rows: data.table.rows || [] };
    } catch (e) {
        return null;
    } finally { clearTimeout(tm); }
}
function cellText(c) {
    if (!c) return "";
    const raw = (c.f !== undefined && c.f !== null) ? c.f : c.v;
    return raw === undefined || raw === null ? "" : String(raw).trim();
}

function submitToGoogleForm(formId, fields) {
    const formUrl = `https://docs.google.com/forms/d/e/${formId}/formResponse`;
    return new Promise(resolve => {
        const name = "hidden_iframe_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const iframe = document.createElement("iframe");
        iframe.name = name; iframe.style.display = "none";
        document.body.appendChild(iframe);
        const form = document.createElement("form");
        form.action = formUrl; form.method = "POST"; form.target = name; form.style.display = "none";
        Object.entries(fields).forEach(([k, v]) => {
            const i = document.createElement("input");
            i.type = "hidden"; i.name = k; i.value = v;
            form.appendChild(i);
        });
        document.body.appendChild(form);
        let done = false;
        const finish = () => { if (done) return; done = true; setTimeout(() => { form.remove(); iframe.remove(); resolve(true); }, 400); };
        iframe.addEventListener("load", finish);
        setTimeout(finish, 15000);
        form.submit();
    });
}

let PIN_DATABASE = {};
let staffReady = false;
let staffPromise = null;
let user = null;   // { name, role, house, admin }

async function loadPinDatabase() {
    const t = await gviz(STAFF_SHEET_ID, "SELECT A, B, C, D");
    if (!t) return false;
    const db = {};
    t.rows.forEach(row => {
        if (!row.c) return;
        const name = row.c[0] && row.c[0].v != null ? String(row.c[0].v).trim() : "";
        const pin = row.c[1] && row.c[1].v != null ? String(row.c[1].f != null && /^\d+$/.test(String(row.c[1].f)) ? row.c[1].f : row.c[1].v).trim() : "";
        const role = row.c[2] && row.c[2].v ? String(row.c[2].v).trim().toLowerCase() : "member";
        const house = row.c[3] && row.c[3].v ? String(row.c[3].v).trim().toLowerCase() : "foh";
        if (name && pin && !/^name$/i.test(name)) db[pin] = { name, role, house };
    });
    if (!Object.keys(db).length) return false;
    PIN_DATABASE = db;
    staffReady = true;
    return true;
}

function pinKey(d) {
    const i = $("pinInput");
    if (i.value.length >= 4) return;
    i.value += d;
    if (i.value.length === 4) handleLogin();
}

async function handleLogin() {
    const input = $("pinInput");
    const pin = input.value.trim();
    const msg = $("signinMsg");
    if (!pin) return;
    if (!staffReady) {
        msg.className = "signin-msg"; msg.textContent = "Loading staff list...";
        const ok = await staffPromise;
        if (!ok) {
            msg.className = "signin-msg err"; msg.textContent = "Couldn't load the staff list. Check the connection and try again.";
            input.value = "";
            staffPromise = loadPinDatabase();
            return;
        }
    }
    const rec = PIN_DATABASE[pin];
    if (!rec) {
        msg.className = "signin-msg err"; msg.textContent = "Incorrect PIN.";
        input.value = "";
        return;
    }
    msg.textContent = "";
    input.value = "";
    user = { name: rec.name, role: rec.role, house: rec.house, admin: ORDER_ADMINS.some(n => n.toLowerCase() === rec.name.toLowerCase()) };
    try { sessionStorage.setItem("uniformPin", pin); } catch (e) {}
    startSession();
}

function startSession() {
    $("signin").hidden = true;
    $("who").innerHTML = `<span class="avatar">${esc(initials(user.name))}</span><span>${esc(user.name)}</span>`;
    $("hello").textContent = `Hi ${user.name.split(" ")[0]}, what do you need?`;

    renderShop();
    renderCartCount();

function signOut() {
    user = null;
    try { sessionStorage.removeItem("uniformPin"); } catch (e) {}

function tsInfo(c) {
    if (!c || c.v == null) return { id: "", date: null, text: "" };
    const v = String(c.v);
    let d = null;
    if (v.startsWith("Date(")) { const p = v.match(/\d+/g).map(Number); d = new Date(p[0], p[1], p[2], p[3] || 0, p[4] || 0, p[5] || 0); }
    else { const t = new Date(v); if (!isNaN(t)) d = t; }
    return { id: d ? Math.floor(d.getTime() / 1000).toString(36) : v.replace(/\W/g, ""), date: d, text: cellText(c) };
}
function nameTag(name) { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return (h % 1296).toString(36); }
function whenText(d) { return d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : ""; }

function itemLink(key, text) {
    const p = productByKey(key);
    if (!p) return "";
    const links = p.styles ? (/trainer/i.test(text) ? p.styles[1].links : p.styles[0].links) : p.links;
    if (links.u) return links.u;
    return /women/i.test(text) ? links.f : links.m;
}
function itemImg(key, text) {
    const p = productByKey(key);
    if (!p) return "";
    return p.styles ? (/trainer/i.test(text) ? p.styles[1].img : p.styles[0].img) : p.key;
}

async function loadOrders(quiet) {
    if (ordersLoading) return;
    ordersLoading = true;
    ordersError = "";
    if (!quiet && !$("ordersView").hidden) renderOrders();
    const t = await gviz(ORDERS_SHEET_ID, "SELECT *", 15000);
    ordersLoading = false;
    if (!t) {
        ordersError = "Couldn't read the order sheet. Make sure it's shared so anyone with the link can view.";
        if (!$("ordersView").hidden) renderOrders();
        return;
    }
    // Map columns to products by their question titles, falling back to the form's order
    let keys = t.cols.map(c => labelKey(c.label));
    if (keys.filter(Boolean).length < 6) keys = t.cols.map((c, i) => FORM_ORDER[i] || null);
    const idx = k => keys.indexOf(k);
    const iName = idx("name"), iOther = idx("other"), iTs = idx("timestamp") >= 0 ? idx("timestamp") : 0;

    const items = [], marks = [], doneIds = new Set();
    t.rows.forEach(row => {
        const c = row.c || [];
        const name = cellText(c[iName]);
        const other = cellText(c[iOther]);
        const ts = tsInfo(c[iTs]);
        if (other.startsWith(MARK_PREFIX)) {
            const ids = other.slice(MARK_PREFIX.length).trim().split(/\s+/).filter(Boolean);
            ids.forEach(id => doneIds.add(id));
            marks.push({ by: name.replace(/^✔\s*Marked ordered by\s*/i, ""), date: ts.date, ids });
            return;
        }
        if (!name && !keys.some((k, i) => k && k !== "timestamp" && cellText(c[i]))) return;
        const rowId = ts.id + "." + nameTag(name);
        keys.forEach((k, i) => {
            if (!k || k === "timestamp" || k === "name") return;
            const val = cellText(c[i]);
            if (!val) return;
            const lines = k === "other" ? [val] : val.split(/\s*;\s*/).filter(Boolean);
            lines.forEach((line, li) => {
                const m = k === "other" ? null : line.match(/^(\d+)\s*x\s+(.*)$/i);
                items.push({
                    id: `${rowId}.${k}.${li}`, rowId, key: k, name: name || "No name", date: ts.date,
                    qty: m ? +m[1] : 1, det: m ? m[2] : line
                });
            });
        });
    });
    const local = new Set(store("uniformMarked") || []);
    // Forget local marks once the sheet has them
    const stillPending = [...local].filter(id => !doneIds.has(id));
    store("uniformMarked", stillPending);
    stillPending.forEach(id => doneIds.add(id));
    const byId = {};
    items.forEach(it => byId[it.id] = it);
    orders = {
        items: items.filter(it => !doneIds.has(it.id)).sort((a, b) => (b.date || 0) - (a.date || 0)),
        history: marks.map(m => ({ ...m, list: m.ids.map(id => byId[id]).filter(Boolean) })).sort((a, b) => (b.date || 0) - (a.date || 0))
    };
    [...selected].forEach(id => { if (!orders.items.some(it => it.id === id)) selected.delete(id); });
    const n = orders.items.length;
    $("orderCount").textContent = n;
    $("orderCount").hidden = !n;
    if (!$("ordersView").hidden) renderOrders();
}

function renderOrders() {
    const P = $("ordersPanel");
    if (!orders && (ordersLoading || !ordersError)) { P.innerHTML = `<div class="card"><div class="loading"><div class="spinner"></div>Loading orders...</div></div>`; return; }
    if (ordersError && !orders) { P.innerHTML = `<div class="card"><div class="o-empty"><b style="color:#b91c1c">${esc(ordersError)}</b><br><br><button type="button" class="btn-secondary" onclick="loadOrders()">Try again</button></div></div>`; return; }
    const items = orders.items;
    const people = new Set(items.map(it => it.name)).size;
    const pieces = items.filter(it => it.key !== "other").reduce((s, it) => s + it.qty, 0);
    let html = `<div class="card"><div class="o-toolbar">
        <div class="seg">
            <button type="button" class="${oView === "person" ? "on" : ""}" onclick="oView='person'; renderOrders()">By person</button>
            <button type="button" class="${oView === "item" ? "on" : ""}" onclick="oView='item'; renderOrders()">By item</button>
            <button type="button" class="${oView === "history" ? "on" : ""}" onclick="oView='history'; clearSelection(); renderOrders()">Ordered</button>
        </div>
        <div class="o-stats">${oView === "history" ? `<span class="pill">${orders.history.length} times marked</span>` : `<span class="pill gold">${pieces} piece${pieces === 1 ? "" : "s"} to order</span><span class="pill">${people} ${people === 1 ? "person" : "people"}</span>`}</div>
        <button type="button" class="btn-secondary push" onclick="loadOrders()" ${ordersLoading ? "disabled" : ""}>${ICON.refresh} ${ordersLoading ? "Loading..." : "Refresh"}</button>
    </div></div>`;
    if (ordersError) html += `<div class="card"><div class="o-empty" style="padding:1rem"><b style="color:#b91c1c">${esc(ordersError)}</b></div></div>`;

    if (oView === "history") html += historyHtml();
    else if (!items.length) html += `<div class="card"><div class="o-empty">${ICON.check}<br><b>Nothing waiting.</b><br>New orders show up here.</div></div>`;
    else if (oView === "person") html += byPersonHtml(items);
    else html += byItemHtml(items);
    P.innerHTML = html;
    updateSelbar();
}

function itemRow(it, showName) {
    const p = productByKey(it.key);
    const sel = selected.has(it.id);
    const title = it.key === "other" ? "Other request" : p ? p.name : it.key;
    return `<div class="o-item ${sel ? "sel" : ""}" onclick="if (!event.target.closest('a')) toggleSel('${it.id}')">
        <input type="checkbox" ${sel ? "checked" : ""} aria-label="Select" onclick="event.stopPropagation(); toggleSel('${it.id}')">
        <div class="o-main">
            <div class="o-name">${esc(showName ? it.name : title)}</div>
            <div class="o-det ${it.key === "other" ? "o-request" : ""}">${it.key === "other" ? "" : `<span class="qty">${it.qty}×</span>`}${esc(it.det)}</div>
        </div>
        <span class="o-when">${esc(whenText(it.date))}</span>
        ${it.key !== "other" && p ? `<a class="shop-link" href="${esc(itemLink(it.key, it.det))}" target="_blank" rel="noopener">Team Style ${ICON.ext}</a>` : ""}
    </div>`;
}

function byPersonHtml(items) {
    const groups = [];
    items.forEach(it => {
        let g = groups.find(x => x.rowId === it.rowId);
        if (!g) groups.push(g = { rowId: it.rowId, name: it.name, date: it.date, items: [] });
        g.items.push(it);
    });
    const order = PRODUCTS.map(p => p.key).concat(["other"]);
    return groups.map(g => {
        g.items.sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
        const all = g.items.every(it => selected.has(it.id));
        return `<div class="card o-group">
            <div class="o-head">
                <span class="avatar">${esc(initials(g.name))}</span>
                <div><div class="o-title">${esc(g.name)}</div><div class="o-sub">Ordered ${esc(whenText(g.date))}</div></div>
                <div class="push"><button type="button" class="link-btn" onclick="selectMany(${esc(JSON.stringify(g.items.map(i => i.id)))}, ${!all})">${all ? "Unselect all" : "Select all"}</button></div>
            </div>
            ${g.items.map(it => itemRow(it, false)).join("")}
        </div>`;
    }).join("");
}

function byItemHtml(items) {
    const order = PRODUCTS.map(p => p.key).concat(["other"]);
    const groups = {};
    items.forEach(it => {
        const variant = it.key === "polo" && /trainer/i.test(it.det) ? "polo_trainer" : it.key;
        (groups[variant] = groups[variant] || []).push(it);
    });
    return Object.keys(groups).sort((a, b) => order.indexOf(a.replace("_trainer", "")) - order.indexOf(b.replace("_trainer", ""))).map(gk => {
        const list = groups[gk].sort((a, b) => a.det.localeCompare(b.det, undefined, { numeric: true }));
        const key = gk === "polo_trainer" ? "polo" : gk;
        const p = productByKey(key);
        const title = gk === "other" ? "Other requests" : gk === "polo_trainer" ? "Trainer Polo" : p.name;
        const total = list.reduce((s, it) => s + it.qty, 0);
        const sample = gk === "polo_trainer" ? "Trainer" : "";
        const linksHtml = !p ? "" : (() => {
            const L = p.styles ? (gk === "polo_trainer" ? p.styles[1].links : p.styles[0].links) : p.links;
            if (L.u) return `<a class="shop-link" href="${esc(L.u)}" target="_blank" rel="noopener">Team Style ${ICON.ext}</a>`;
            const hasM = list.some(it => !/women/i.test(it.det)), hasF = list.some(it => /women/i.test(it.det));
            return (hasM ? `<a class="shop-link" href="${esc(L.m)}" target="_blank" rel="noopener">Men's ${ICON.ext}</a>` : "") + (hasF ? `<a class="shop-link" href="${esc(L.f)}" target="_blank" rel="noopener">Women's ${ICON.ext}</a>` : "");
        })();
        const all = list.every(it => selected.has(it.id));
        return `<div class="card o-group">
            <div class="o-head">
                <span class="thumb">${p ? photoHtml(itemImg(key, sample), title) : ICON.shirt}</span>
                <div><div class="o-title">${esc(title)}</div><div class="o-sub">${gk === "other" ? `${list.length} request${list.length === 1 ? "" : "s"}` : `${total} total`}</div></div>
                <div class="push">${linksHtml}<button type="button" class="link-btn" onclick="selectMany(${esc(JSON.stringify(list.map(i => i.id)))}, ${!all})">${all ? "Unselect all" : "Select all"}</button></div>
            </div>
            ${list.map(it => itemRow(it, true)).join("")}
        </div>`;
    }).join("");
}

function historyHtml() {
    if (!orders.history.length) return `<div class="card"><div class="o-empty">Nothing marked ordered yet.</div></div>`;
    return `<div class="card o-group">${orders.history.slice(0, 100).map(h => `
        <div class="hist-row">
            <div style="min-width:9rem"><div class="o-title" style="font-size:0.95rem">${esc(whenText(h.date))}</div><div class="o-sub">by ${esc(h.by || "someone")}</div></div>
            <ul>${h.list.length ? h.list.map(it => `<li><b>${esc(it.name)}</b> · ${esc(it.key === "other" ? "Request" : productByKey(it.key) ? productByKey(it.key).name : it.key)} · ${it.key === "other" ? "" : it.qty + "× "}${esc(it.det)}</li>`).join("") : `<li>${h.ids.length} item${h.ids.length === 1 ? "" : "s"}</li>`}</ul>
        </div>`).join("")}</div>`;
}

function toggleSel(id) {
    if (selected.has(id)) selected.delete(id); else selected.add(id);
    renderOrders();
}
function selectMany(ids, on) { ids.forEach(id => on ? selected.add(id) : selected.delete(id)); renderOrders(); }
function clearSelection() { selected.clear(); updateSelbar(); if (orders && !$("ordersView").hidden) renderOrders(); }
function updateSelbar() {
    const n = selected.size;
    const on = n > 0 && !$("ordersView").hidden;
    $("selbar").classList.toggle("on", on);
    document.body.classList.toggle("has-selbar", on);
    $("selMsg").textContent = `${n} selected`;
}

async function markSelectedOrdered() {
    const ids = [...selected];
    if (!ids.length) return;
    const btn = $("markBtn");
    btn.disabled = true; btn.textContent = "Saving...";
    await submitToGoogleForm(FORM_ID, {
        [F.name]: "✔ Marked ordered by " + user.name,
        [F.other]: MARK_PREFIX + " " + ids.join(" ")
    });
    store("uniformMarked", (store("uniformMarked") || []).concat(ids));
    const done = orders.items.filter(it => selected.has(it.id));
    orders.items = orders.items.filter(it => !selected.has(it.id));
    orders.history.unshift({ by: user.name, date: new Date(), ids, list: done });
    selected.clear();
    btn.disabled = false; btn.textContent = "Mark as ordered";
    $("orderCount").textContent = orders.items.length;
    $("orderCount").hidden = !orders.items.length;
    renderOrders();
    toast(`Marked ${ids.length} as ordered.`, "success");
    setTimeout(() => loadOrders(true), 5000);
}

document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if ($("productOverlay").classList.contains("active")) closeProduct();
    else if ($("cartOverlay").classList.contains("active")) closeCart();
});
$("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });

staffPromise = loadPinDatabase();
(async () => {
    let pin = "";
    try { pin = sessionStorage.getItem("uniformPin") || ""; } catch (e) {}
    if (pin) {
        const ok = await staffPromise;
        if (ok && PIN_DATABASE[pin]) { $("pinInput").value = pin; handleLogin(); return; }
    }
    $("pinInput").focus();
})();
